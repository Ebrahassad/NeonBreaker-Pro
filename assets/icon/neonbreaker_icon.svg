<svg width="1024" height="1024" viewBox="0 0 1024 1024"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#261044"/>
      <stop offset="55%" stop-color="#0D061A"/>
      <stop offset="100%" stop-color="#020207"/>
    </radialGradient>

    <linearGradient id="paddle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#42E8FF"/>
      <stop offset="50%" stop-color="#B83CFF"/>
      <stop offset="100%" stop-color="#FF3EA5"/>
    </linearGradient>

    <radialGradient id="ball">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#C7FAFF"/>
      <stop offset="75%" stop-color="#42E8FF"/>
      <stop offset="100%" stop-color="#008FA8"/>
    </radialGradient>

    <filter id="glowCyan">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowPurple">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowPink">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowOrange">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark game-like background -->
  <rect width="1024" height="1024" rx="180" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity=".10" stroke="#A84DFF" stroke-width="2">
    <path d="M128 0V1024"/>
    <path d="M256 0V1024"/>
    <path d="M384 0V1024"/>
    <path d="M512 0V1024"/>
    <path d="M640 0V1024"/>
    <path d="M768 0V1024"/>
    <path d="M896 0V1024"/>
    <path d="M0 128H1024"/>
    <path d="M0 256H1024"/>
    <path d="M0 384H1024"/>
    <path d="M0 512H1024"/>
    <path d="M0 640H1024"/>
    <path d="M0 768H1024"/>
    <path d="M0 896H1024"/>
  </g>

  <!-- Neon border -->
  <rect x="42" y="42" width="940" height="940"
        rx="150"
        fill="none"
        stroke="#8A2BFF"
        stroke-width="22"
        opacity=".35"
        filter="url(#glowPurple)"/>

  <rect x="50" y="50" width="924" height="924"
        rx="145"
        fill="none"
        stroke="#42E8FF"
        stroke-width="8"/>

  <!-- Bricks -->
  <g stroke="#FFFFFF" stroke-width="6" opacity=".95">

    <!-- Row 1 -->
    <rect x="150" y="170" width="150" height="62" rx="16"
          fill="#42E8FF" filter="url(#glowCyan)"/>
    <rect x="325" y="170" width="150" height="62" rx="16"
          fill="#B83CFF" filter="url(#glowPurple)"/>
    <rect x="500" y="170" width="150" height="62" rx="16"
          fill="#FF3EA5" filter="url(#glowPink)"/>
    <rect x="675" y="170" width="150" height="62" rx="16"
          fill="#FFD447" filter="url(#glowOrange)"/>

    <!-- Row 2 -->
    <rect x="235" y="260" width="150" height="62" rx="16"
          fill="#B83CFF" filter="url(#glowPurple)"/>
    <rect x="410" y="260" width="150" height="62" rx="16"
          fill="#42E8FF" filter="url(#glowCyan)"/>
    <rect x="585" y="260" width="150" height="62" rx="16"
          fill="#FF3EA5" filter="url(#glowPink)"/>

  </g>

  <!-- Explosive brick -->
  <rect x="675" y="260" width="150" height="62" rx="16"
        fill="#FF6B2C"
        stroke="#FFFFFF"
        stroke-width="6"
        filter="url(#glowOrange)"/>

  <g stroke="#FFFFFF" stroke-width="9" stroke-linecap="round">
    <path d="M715 280L785 302"/>
    <path d="M785 280L715 302"/>
  </g>

  <!-- Ball trail -->
  <path d="M310 590 Q380 520 455 470"
        fill="none"
        stroke="#42E8FF"
        stroke-width="28"
        stroke-linecap="round"
        opacity=".22"
        filter="url(#glowCyan)"/>

  <path d="M335 575 Q395 520 455 478"
        fill="none"
        stroke="#42E8FF"
        stroke-width="10"
        stroke-linecap="round"
        opacity=".7"/>

  <!-- Ball glow -->
  <circle cx="512" cy="470" r="105"
          fill="#42E8FF"
          opacity=".22"
          filter="url(#glowCyan)"/>

  <!-- Ball -->
  <circle cx="512" cy="470" r="70"
          fill="url(#ball)"
          stroke="#FFFFFF"
          stroke-width="6"
          filter="url(#glowCyan)"/>

  <!-- Ball highlight -->
  <circle cx="490" cy="447" r="17" fill="#FFFFFF"/>

  <!-- Impact sparks -->
  <g stroke="#FFFFFF" stroke-width="8" stroke-linecap="round">
    <path d="M512 350V320"/>
    <path d="M590 385L612 362"/>
    <path d="M632 470H662"/>
    <path d="M590 555L612 578"/>
    <path d="M434 385L412 362"/>
  </g>

  <!-- Paddle glow -->
  <rect x="250" y="755" width="524" height="78"
        rx="38"
        fill="#42E8FF"
        opacity=".30"
        filter="url(#glowCyan)"/>

  <!-- Paddle -->
  <rect x="250" y="755" width="524" height="78"
        rx="38"
        fill="url(#paddle)"
        stroke="#FFFFFF"
        stroke-width="7"/>

  <!-- Paddle highlight -->
  <rect x="270" y="770" width="484" height="18"
        rx="9"
        fill="#FFFFFF"
        opacity=".70"/>

</svg>
