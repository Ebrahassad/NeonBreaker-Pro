name: NeonBreaker Pro Official Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore official signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64"

          mkdir -p android/keystore

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > android/keystore/neonbreaker-release.jks

          chmod 600 android/keystore/neonbreaker-release.jks

          test -s android/keystore/neonbreaker-release.jks

          echo "Official keystore restored."

      - name: Verify official keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"

          KEYSTORE="android/keystore/neonbreaker-release.jks"

          test -s "$KEYSTORE"

          keytool -list \
            -keystore "$KEYSTORE" \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            >/dev/null

          echo "OFFICIAL KEYSTORE: OK"
          echo "OFFICIAL ALIAS: OK"

      - name: Verify package
        run: |
          set -e

          grep -nE \
            'namespace|applicationId' \
            android/app/build.gradle.kts

          grep -q \
            'namespace = "hassadi.neonbreaker.pro"' \
            android/app/build.gradle.kts

          grep -q \
            'applicationId = "hassadi.neonbreaker.pro"' \
            android/app/build.gradle.kts

          echo "PACKAGE: hassadi.neonbreaker.pro"

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Create key.properties and build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"

          cat > android/key.properties <<EOF2
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore/neonbreaker-release.jks
          EOF2

          chmod 600 android/key.properties

          test -s android/key.properties

          echo "key.properties created."

          flutter clean
          flutter pub get

          flutter build apk --release

      - name: Verify official APK signature
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "========== APK =========="
          ls -lh "$APK"

          echo
          echo "========== APK SIGNATURE =========="

          apksigner verify \
            --verbose \
            --print-certs \
            "$APK"

          echo
          echo "========== APK SHA256 =========="

          sha256sum "$APK"

      - name: Prepare official release
        run: |
          set -e

          mkdir -p release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            release/NeonBreaker-Pro-official.apk

          sha256sum \
            release/NeonBreaker-Pro-official.apk \
            > release/SHA256SUMS.txt

          echo "========== RELEASE FILES =========="

          ls -lh release/

          echo
          cat release/SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(date +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          fi

          gh release create "$TAG" \
            release/NeonBreaker-Pro-official.apk \
            release/SHA256SUMS.txt \
            --title "NeonBreaker Pro $TAG" \
            --generate-notes
