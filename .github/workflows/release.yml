name: NeonBreaker Pro Official Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Verify package name
        run: |
          grep -nE 'namespace|applicationId' android/app/build.gradle.kts
          grep -RIn "package hassadi.neonbreaker.pro" android/app/src/main || true

      - name: Restore official signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > android/keystore/neonbreaker-release.jks
          chmod 600 android/keystore/neonbreaker-release.jks

      - name: Create signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF2
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore/neonbreaker-release.jks
          EOF2

      - name: Verify signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore android/keystore/neonbreaker-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      - name: Analyze
        run: flutter analyze

      - name: Build official release APK
        run: flutter build apk --release

      - name: Verify APK package
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "========== APK =========="
          ls -lh "$APK"

          echo
          echo "========== SHA256 =========="
          sha256sum "$APK"

          echo
          echo "========== SIGNATURE =========="
          apksigner verify --verbose --print-certs "$APK"

      - name: Prepare release files
        run: |
          mkdir -p release

          cp build/app/outputs/flutter-apk/app-release.apk \
             release/NeonBreaker-Pro-official.apk

          sha256sum release/NeonBreaker-Pro-official.apk \
             > release/SHA256SUMS.txt

          echo "========== RELEASE SHA256 =========="
          cat release/SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="official-${GITHUB_RUN_NUMBER}"
          fi

          gh release create "$TAG" \
            release/NeonBreaker-Pro-official.apk \
            release/SHA256SUMS.txt \
            --title "NeonBreaker Pro $TAG" \
            --notes "Official signed release.

Package: hassadi.neonbreaker.pro
Signed with the official NeonBreaker release keystore.
SHA-256 is provided in SHA256SUMS.txt."

      - name: Final SHA256
        run: |
          echo
          echo "=========================================="
          echo "OFFICIAL RELEASE COMPLETE"
          echo "=========================================="
          echo "PACKAGE: hassadi.neonbreaker.pro"
          echo "APK: NeonBreaker-Pro-official.apk"
          echo
          echo "SHA256:"
          sha256sum release/NeonBreaker-Pro-official.apk
          echo "=========================================="
