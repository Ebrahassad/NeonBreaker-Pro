name: NeonBreaker Pro Official Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Verify package name
        run: |
          set -e
          grep -nE 'namespace|applicationId' android/app/build.gradle.kts
          grep -RIn "package hassadi.neonbreaker.pro" android/app/src/main || true

      - name: Restore official signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64"

          mkdir -p android/keystore

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > android/keystore/neonbreaker-release.jks

          chmod 600 android/keystore/neonbreaker-release.jks

          test -s android/keystore/neonbreaker-release.jks

          echo "Keystore restored."

      - name: Verify GitHub signing secrets
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          KEYSTORE="android/keystore/neonbreaker-release.jks"

          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -s "$KEYSTORE"

          echo "========== KEYSTORE SHA256 =========="
          sha256sum "$KEYSTORE"

          echo "========== KEYSTORE ENTRY =========="
          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$RELEASE_STORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" \
            | grep -E 'Alias name|Entry type'

          echo "========== REAL PRIVATE KEY TEST =========="

          rm -f /tmp/neonbreaker-test.p12

          keytool -importkeystore \
            -srckeystore "$KEYSTORE" \
            -srcstoretype JKS \
            -srcstorepass "$RELEASE_STORE_PASSWORD" \
            -srcalias "$RELEASE_KEY_ALIAS" \
            -srckeypass "$RELEASE_KEY_PASSWORD" \
            -destkeystore /tmp/neonbreaker-test.p12 \
            -deststoretype PKCS12 \
            -deststorepass "$RELEASE_STORE_PASSWORD" \
            -destkeypass "$RELEASE_STORE_PASSWORD" \
            -noprompt

          test -s /tmp/neonbreaker-test.p12

          echo "PRIVATE KEY PASSWORD IS VALID"
          rm -f /tmp/neonbreaker-test.p12

      - name: Analyze
        run: flutter analyze


      - name: Build official release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"

          test -s android/keystore/neonbreaker-release.jks

          echo "Building with official signing configuration..."

          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Verify APK package
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "========== APK =========="
          ls -lh "$APK"

          echo
          echo "========== SHA256 =========="
          sha256sum "$APK"

          echo
          echo "========== SIGNATURE =========="
          apksigner verify --verbose --print-certs "$APK"

      - name: Prepare release files
        run: |
          set -e

          mkdir -p release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            release/NeonBreaker-Pro-official.apk

          sha256sum \
            release/NeonBreaker-Pro-official.apk \
            > release/SHA256SUMS.txt

          cat release/SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(date +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          fi

          gh release create "$TAG" \
            release/NeonBreaker-Pro-official.apk \
            release/SHA256SUMS.txt \
            --title "NeonBreaker Pro $TAG" \
            --generate-notes
