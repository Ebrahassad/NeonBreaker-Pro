name: NeonBreaker Pro Official Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Verify package name
        run: |
          grep -nE 'namespace|applicationId' android/app/build.gradle.kts
          grep -RIn "package hassadi.neonbreaker.pro" android/app/src/main || true

      - name: Verify signing files
        run: |
          set -e

          test -s android/key.properties
          test -s android/keystore/neonbreaker-release.jks

          echo "Signing files found."

          grep -E '^(keyAlias|storeFile)=' android/key.properties

      - name: Verify signing key
        run: |
          set -e

          KEYSTORE=$(grep '^storeFile=' android/key.properties | cut -d= -f2-)
          KEY_ALIAS=$(grep '^keyAlias=' android/key.properties | cut -d= -f2-)
          STORE_PASSWORD=$(grep '^storePassword=' android/key.properties | cut -d= -f2-)

          keytool -list \
            -keystore "android/$KEYSTORE" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      - name: Analyze
        run: flutter analyze

      - name: Build official release APK
        run: flutter build apk --release

      - name: Verify APK package
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "========== APK =========="
          ls -lh "$APK"

          echo
          echo "========== SHA256 =========="
          sha256sum "$APK"

          echo
          echo "========== SIGNATURE =========="
          apksigner verify --verbose --print-certs "$APK"

      - name: Prepare release files
        run: |
          set -e

          mkdir -p release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            release/NeonBreaker-Pro-official.apk

          sha256sum \
            release/NeonBreaker-Pro-official.apk \
            > release/SHA256SUMS.txt

          echo "========== RELEASE SHA256 =========="
          cat release/SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(date +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          fi

          gh release create "$TAG" \
            release/NeonBreaker-Pro-official.apk \
            release/SHA256SUMS.txt \
            --title "NeonBreaker Pro $TAG" \
            --generate-notes
